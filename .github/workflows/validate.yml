name: Validate and build
on: [push, pull_request, workflow_dispatch]
jobs:
  reference:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[print]'
      - run: python -m unittest discover -s tests -v
      - run: open-atlas validate examples/reference
      - run: open-atlas validate examples/war-events
      - run: open-atlas build examples/reference --output /tmp/open-atlas --pdf
